<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AnonLetter — You have a letter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400;1,600&family=DM+Sans:opsz,wght@9..40,200;9..40,300;9..40,400&display=swap" rel="stylesheet">

<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --void:      #0b0c1a;
  --navy:      #131525;
  --deep:      #1a1b2e;
  --nebula:    #22254a;
  --mist:      #8b90d0;
  --starlight: #c8caf0;
  --gold:      #c9a96e;
  --goldlt:    #e2c99a;
  --paper-fg:  rgba(200, 202, 240, 0.82);
  --paper-dim: rgba(139, 144, 208, 0.45);
  --ui-dim:    rgba(139, 144, 208, 0.22);
}

html { overflow-x: hidden; }

body {
  background: var(--void);
  color: var(--starlight);
  font-family: 'DM Sans', sans-serif;
  font-weight: 300;
  overflow-x: hidden;
  cursor: none;
  /* enough height to scroll */
  min-height: 400vh;
}

/* ── CUSTOM CURSOR ── */
#cursor {
  position: fixed;
  width: 6px; height: 6px;
  background: var(--mist);
  border-radius: 50%;
  pointer-events: none;
  z-index: 9999;
  transform: translate(-50%,-50%);
  mix-blend-mode: screen;
  transition: background 0.3s;
}
#cursor-ring {
  position: fixed;
  width: 28px; height: 28px;
  border: 1px solid rgba(139,144,208,0.3);
  border-radius: 50%;
  pointer-events: none;
  z-index: 9998;
  transform: translate(-50%,-50%);
  transition: width 0.4s, height 0.4s;
}

/* ══════════════════════
   FIXED BG — PARALLAX UNIVERSE
══════════════════════ */
#universe {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
}

/* Nebula glow — slowest */
#nebula-layer {
  position: absolute;
  inset: -20%;
  background:
    radial-gradient(ellipse 55% 35% at 30% 40%, rgba(60,55,140,0.28) 0%, transparent 65%),
    radial-gradient(ellipse 40% 50% at 75% 65%, rgba(80,40,120,0.18) 0%, transparent 60%),
    radial-gradient(ellipse 70% 30% at 50% 20%, rgba(30,30,80,0.35) 0%, transparent 70%);
  will-change: transform;
}

/* Stars layer 1 — far, slowest parallax */
#stars-far {
  position: absolute;
  inset: -30%;
  will-change: transform;
}

/* Stars layer 2 — mid */
#stars-mid {
  position: absolute;
  inset: -20%;
  will-change: transform;
}

/* Stars layer 3 — near, fastest parallax */
#stars-near {
  position: absolute;
  inset: -10%;
  will-change: transform;
}

/* ══════════════════════
   PHASE 1 — ENVELOPE ENTRY
   (fixed, transitions to scroll phase)
══════════════════════ */
#entry-phase {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  transition: opacity 0.8s ease;
}
#entry-phase.hidden {
  opacity: 0;
  pointer-events: none;
}

/* AnonLetter wordmark */
.wordmark {
  font-family: 'Cormorant Garamond', serif;
  font-size: 11px;
  font-weight: 400;
  letter-spacing: 0.45em;
  text-transform: uppercase;
  color: var(--gold);
  opacity: 0;
  margin-bottom: 60px;
  position: absolute;
  top: 36px;
  left: 50%;
  transform: translateX(-50%);
  white-space: nowrap;
}

/* Envelope */
#env-scene {
  position: relative;
  perspective: 800px;
  width: 280px;
  height: 195px;
  opacity: 0;
  transform: translateY(-60px);
}

.env-shell {
  width: 100%;
  height: 100%;
  position: relative;
  background: linear-gradient(150deg, #1c1d38 0%, #141526 60%, #0e0f20 100%);
  border: 1px solid rgba(139,144,208,0.18);
  border-radius: 3px;
  box-shadow:
    0 50px 100px rgba(0,0,0,0.8),
    0 0 60px rgba(60,60,140,0.12),
    inset 0 1px 0 rgba(139,144,208,0.08);
}

/* diagonal crease lines on envelope */
.env-shell::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    linear-gradient(135deg, transparent 49.6%, rgba(139,144,208,0.05) 49.6%, rgba(139,144,208,0.05) 50.4%, transparent 50.4%),
    linear-gradient(225deg, transparent 49.6%, rgba(139,144,208,0.05) 49.6%, rgba(139,144,208,0.05) 50.4%, transparent 50.4%);
  border-radius: 3px;
}

/* flap — triangle clip, opens with 3D rotate */
.env-flap {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 50%;
  background: linear-gradient(175deg, #151628 0%, #1c1d38 100%);
  clip-path: polygon(0 0, 100% 0, 50% 100%);
  transform-origin: top center;
  transform-style: preserve-3d;
  border-bottom: 1px solid rgba(139,144,208,0.10);
  z-index: 5;
  transition: transform 1.4s cubic-bezier(0.4, 0, 0.2, 1);
  border-radius: 3px 3px 0 0;
}
.env-flap.open { transform: rotateX(-185deg); }

/* wax seal */
.wax-seal {
  position: absolute;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  width: 44px; height: 44px;
  z-index: 6;
  transition: opacity 0.5s ease, transform 0.5s ease;
}
.wax-seal.gone { opacity: 0; transform: translate(-50%,-50%) scale(0.6); }
.wax-seal svg { width: 100%; height: 100%; }

/* letter rising from envelope */
.letter-rise {
  position: absolute;
  bottom: 10px; left: 18px; right: 18px;
  height: 0;
  background: linear-gradient(175deg, #161728 0%, #12132a 100%);
  border: 1px solid rgba(139,144,208,0.12);
  border-radius: 2px 2px 0 0;
  overflow: hidden;
  z-index: 4;
  transition: height 1s cubic-bezier(0.4, 0, 0.2, 1) 0.4s;
  box-shadow: 0 -8px 30px rgba(0,0,0,0.5);
}
.letter-rise.open { height: 140px; }

/* ══════════════════════
   PHASE 2 — SCROLL: LETTER
══════════════════════ */
#scroll-phase {
  position: relative;
  z-index: 5;
  /* First 100vh is empty — let entry phase play */
  padding-top: 100vh;
}

/* letter card — pinned by JS on scroll */
#letter-stage {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding: 0 24px 200px;
}

#letter-card {
  position: relative;
  width: 100%;
  max-width: 580px;
  background: linear-gradient(170deg, #14152a 0%, #0f1022 100%);
  border: 1px solid rgba(139,144,208,0.13);
  border-radius: 4px;
  padding: 56px 52px 48px;
  box-shadow:
    0 80px 160px rgba(0,0,0,0.7),
    0 0 0 1px rgba(139,144,208,0.04),
    0 0 80px rgba(40,40,120,0.12),
    inset 0 1px 0 rgba(139,144,208,0.06);
  opacity: 0;
  transform: translateY(50px);
  will-change: transform;
  /* counter-parallax — moves slightly up as you scroll down */
}

/* top ornament line */
#letter-card::before {
  content: '';
  position: absolute;
  top: 0; left: 52px; right: 52px;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(139,144,208,0.3) 30%, rgba(139,144,208,0.3) 70%, transparent);
}

/* received notice */
.received-notice {
  position: absolute;
  top: -32px;
  left: 0; right: 0;
  text-align: center;
  font-size: 9px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--ui-dim);
  opacity: 0;
  transition: opacity 1s ease;
}
.received-notice.show { opacity: 1; }

/* greeting line */
.letter-greeting {
  font-family: 'DM Sans', sans-serif;
  font-size: 10px;
  font-weight: 300;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--ui-dim);
  margin-bottom: 36px;
  opacity: 0;
  transition: opacity 0.8s ease;
}
.letter-greeting.show { opacity: 1; }

/* body */
.letter-body {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(19px, 2.4vw, 24px);
  font-style: italic;
  font-weight: 300;
  line-height: 1.85;
  color: var(--paper-fg);
  min-height: 200px;
  position: relative;
}

#typewriter-out {
  display: inline;
}
/* blinking cursor */
#typewriter-out::after {
  content: '|';
  color: rgba(139,144,208,0.5);
  animation: cur 1.1s step-end infinite;
  font-style: normal;
  font-weight: 200;
}
#typewriter-out.done::after { display: none; }
@keyframes cur { 0%,100%{opacity:1} 50%{opacity:0} }

/* divider */
.letter-divider {
  margin: 40px 0 32px;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(139,144,208,0.12) 40%, rgba(139,144,208,0.12) 60%, transparent);
  opacity: 0;
  transition: opacity 1s ease;
}
.letter-divider.show { opacity: 1; }

/* from line */
.letter-from {
  font-family: 'Cormorant Garamond', serif;
  font-size: 14px;
  font-style: italic;
  font-weight: 300;
  color: var(--paper-dim);
  text-align: right;
  letter-spacing: 0.04em;
  opacity: 0;
  transition: opacity 2s ease;
}
.letter-from.show { opacity: 1; }

/* ── READ RECEIPT ── */
#read-receipt {
  margin-top: 48px;
  display: flex;
  align-items: center;
  gap: 10px;
  opacity: 0;
  transition: opacity 1.5s ease;
  pointer-events: none;
}
#read-receipt.show { opacity: 1; pointer-events: auto; }

.receipt-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--gold);
  box-shadow: 0 0 8px rgba(201,169,110,0.6);
  animation: pulseDot 2s ease-in-out infinite;
}
@keyframes pulseDot {
  0%,100%{ box-shadow: 0 0 6px rgba(201,169,110,0.4); transform: scale(1); }
  50%{ box-shadow: 0 0 16px rgba(201,169,110,0.8); transform: scale(1.3); }
}
.receipt-text {
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--gold);
  opacity: 0.6;
}

/* ── BOTTOM WATERMARK ── */
#watermark {
  margin-top: 80px;
  text-align: center;
  opacity: 0;
  transition: opacity 1.5s ease;
}
#watermark.show { opacity: 1; }
.watermark-wordmark {
  font-family: 'Cormorant Garamond', serif;
  font-size: 11px;
  letter-spacing: 0.4em;
  text-transform: uppercase;
  color: rgba(139,144,208,0.18);
}
.watermark-line {
  margin-top: 8px;
  font-size: 9px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: rgba(139,144,208,0.1);
}
.watermark-link {
  display: inline-block;
  margin-top: 16px;
  font-size: 9px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: rgba(139,144,208,0.2);
  text-decoration: none;
  border-bottom: 1px solid rgba(139,144,208,0.1);
  padding-bottom: 2px;
  transition: color 0.3s, border-color 0.3s;
}
.watermark-link:hover {
  color: rgba(139,144,208,0.5);
  border-color: rgba(139,144,208,0.3);
}

/* ── REPORT BUTTON ── */
#report-btn {
  position: fixed;
  bottom: 28px;
  right: 28px;
  z-index: 20;
  font-size: 9px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: rgba(139,144,208,0.18);
  background: none;
  border: none;
  cursor: none;
  padding: 8px;
  transition: color 0.3s;
  opacity: 0;
}
#report-btn.show { opacity: 1; }
#report-btn:hover { color: rgba(139,144,208,0.5); }

/* ── SCROLL PROGRESS ── */
#progress-bar {
  position: fixed;
  top: 0; left: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--mist) 50%, var(--goldlt));
  z-index: 100;
  width: 0%;
  transition: width 0.1s linear;
  opacity: 0.5;
}

/* ── PARALLAX HINT ── */
#scroll-hint {
  position: fixed;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  z-index: 20;
  opacity: 0;
  transition: opacity 0.6s ease;
  pointer-events: none;
}
#scroll-hint.show { opacity: 1; }
#scroll-hint.hide { opacity: 0; }
.hint-line {
  width: 1px; height: 36px;
  background: linear-gradient(to bottom, rgba(139,144,208,0.5), transparent);
  animation: hintDrop 2s ease-in-out infinite;
}
.hint-label {
  font-size: 8px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--ui-dim);
}
@keyframes hintDrop {
  0%,100%{ opacity:0.3; transform: scaleY(0.7); }
  50%{ opacity:1; transform: scaleY(1); }
}

/* ── REDUCED MOTION ── */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<div id="cursor"></div>
<div id="cursor-ring"></div>
<div id="progress-bar"></div>

<!-- ══ UNIVERSE (fixed bg, parallax layers) ══ -->
<div id="universe">
  <div id="nebula-layer"></div>
  <canvas id="stars-far"></canvas>
  <canvas id="stars-mid"></canvas>
  <canvas id="stars-near"></canvas>
</div>

<!-- ══ PHASE 1: ENVELOPE ENTRY ══ -->
<div id="entry-phase">
  <span class="wordmark">AnonLetter</span>

  <div id="env-scene">
    <div class="env-shell">
      <div class="env-flap" id="env-flap"></div>
      <div class="wax-seal" id="wax-seal">
        <svg viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg">
          <circle cx="22" cy="22" r="21" fill="#6a1a2a" stroke="rgba(201,169,110,0.5)" stroke-width="0.8"/>
          <circle cx="22" cy="22" r="17" fill="none" stroke="rgba(201,169,110,0.2)" stroke-width="0.5"/>
          <text x="22" y="28" text-anchor="middle"
            font-family="Cormorant Garamond, serif"
            font-size="16" fill="rgba(201,169,110,0.9)"
            font-style="italic">A</text>
        </svg>
      </div>
      <div class="letter-rise" id="letter-rise"></div>
    </div>
  </div>
</div>

<!-- ══ PHASE 2: SCROLL LETTER ══ -->
<div id="scroll-phase">
  <div id="letter-stage">

    <div id="letter-card">
      <p class="received-notice" id="received-notice">Received — just now</p>
      <p class="letter-greeting" id="letter-greeting">For you</p>

      <div class="letter-body">
        <span id="typewriter-out"></span>
      </div>

      <div class="letter-divider" id="letter-divider"></div>

      <p class="letter-from" id="letter-from">— from someone who wanted you to know</p>
    </div>

    <div id="read-receipt">
      <div class="receipt-dot"></div>
      <span class="receipt-text">This letter was written for you</span>
    </div>

    <div id="watermark">
      <p class="watermark-wordmark">AnonLetter</p>
      <p class="watermark-line">The sender remains anonymous · forever</p>
      <a href="#" class="watermark-link">Send your own letter</a>
    </div>

  </div>
</div>

<button id="report-btn">Report</button>

<div id="scroll-hint">
  <div class="hint-line"></div>
  <span class="hint-label">Scroll to read</span>
</div>

<!-- GSAP -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

<script>
gsap.registerPlugin(ScrollTrigger);

/* ════════════════════════════
   CURSOR
════════════════════════════ */
const cursorDot  = document.getElementById('cursor');
const cursorRing = document.getElementById('cursor-ring');
let mx=0, my=0, rx=0, ry=0;

document.addEventListener('mousemove', e => {
  mx = e.clientX; my = e.clientY;
  cursorDot.style.left = mx + 'px';
  cursorDot.style.top  = my + 'px';
});
(function animRing(){
  rx += (mx-rx)*0.10;
  ry += (my-ry)*0.10;
  cursorRing.style.left = rx + 'px';
  cursorRing.style.top  = ry + 'px';
  requestAnimationFrame(animRing);
})();


/* ════════════════════════════
   STAR FIELDS — three canvases
════════════════════════════ */
function buildStarField(canvasId, count, minR, maxR, color){
  const cv = document.getElementById(canvasId);
  const c  = cv.getContext('2d');
  const stars = [];

  function resize(){
    cv.width  = window.innerWidth * 1.6;
    cv.height = window.innerHeight * 1.6;
    c.clearRect(0,0,cv.width,cv.height);
    stars.length = 0;
    for(let i=0;i<count;i++){
      stars.push({
        x: Math.random()*cv.width,
        y: Math.random()*cv.height,
        r: Math.random()*(maxR-minR)+minR,
        a: Math.random()*0.7+0.1,
        phase: Math.random()*Math.PI*2
      });
    }
    draw(0);
  }

  function draw(t){
    c.clearRect(0,0,cv.width,cv.height);
    stars.forEach(s=>{
      const flicker = s.a*(0.7+0.3*Math.sin(t*0.0008+s.phase));
      c.beginPath();
      c.arc(s.x, s.y, s.r, 0, Math.PI*2);
      c.fillStyle = color.replace('ALPHA', flicker.toFixed(3));
      c.fill();
    });
  }

  resize();
  window.addEventListener('resize', resize);

  // tick for twinkling
  let frame=0;
  (function tick(){
    frame++;
    draw(frame);
    requestAnimationFrame(tick);
  })();

  return cv;
}

buildStarField('stars-far',  120, 0.3, 0.8,  'rgba(180,185,240,ALPHA)');
buildStarField('stars-mid',   60, 0.5, 1.2,  'rgba(210,215,255,ALPHA)');
buildStarField('stars-near',  25, 0.8, 1.8,  'rgba(240,240,255,ALPHA)');


/* ════════════════════════════
   PARALLAX — scroll driven
════════════════════════════ */
window.addEventListener('scroll', () => {
  const sy = window.scrollY;
  const vh = window.innerHeight;
  const maxScroll = document.body.scrollHeight - vh;
  const progress  = sy / maxScroll;

  // progress bar
  document.getElementById('progress-bar').style.width = (progress*100) + '%';

  // nebula — very slow
  document.getElementById('nebula-layer').style.transform =
    `translateY(${sy * 0.08}px) translateX(${sy * 0.02}px)`;

  // stars — three speeds
  document.getElementById('stars-far').style.transform =
    `translateY(${sy * 0.15}px)`;
  document.getElementById('stars-mid').style.transform =
    `translateY(${sy * 0.35}px) translateX(${sy * -0.04}px)`;
  document.getElementById('stars-near').style.transform =
    `translateY(${sy * 0.6}px) translateX(${sy * 0.06}px)`;

  // letter card — counter-parallax (floats up gently against scroll)
  const card = document.getElementById('letter-card');
  if(card){
    const cardOffset = Math.max(0, sy - vh) * -0.06;
    card.style.transform = `translateY(${cardOffset}px)`;
  }

  // scroll hint hide after first scroll
  const hint = document.getElementById('scroll-hint');
  if(sy > 60){ hint.classList.add('hide'); }
});


/* ════════════════════════════
   TYPEWRITER — human speed
════════════════════════════ */
const MESSAGE = `There are things I've wanted to say to you for longer than I can remember. Not because the words were missing, but because saying them out loud felt like too much — like it would change something between us in a way I wasn't ready for.

So I wrote this instead.

I think you're remarkable in ways you can't see from the inside. The way you hold things together when everything is asking you to fall apart. The way you show up, every time, even when no one asked.

I wanted you to know that someone notices. Someone always has.`;

let typewriterDone = false;

function runTypewriter(targetEl, text, onDone){
  let i = 0;
  targetEl.textContent = '';
  const baseDelay = 30;

  function next(){
    if(i >= text.length){
      targetEl.classList.add('done');
      if(onDone) onDone();
      return;
    }
    const ch = text[i];
    // human variance: pause longer at punctuation
    let delay = baseDelay + Math.random()*35;
    if(ch === '.') delay += 220;
    else if(ch === ',') delay += 100;
    else if(ch === '\n') delay += 160;
    targetEl.textContent += ch;
    i++;
    setTimeout(next, delay);
  }
  setTimeout(next, 300);
}


/* ════════════════════════════
   ENTRANCE SEQUENCE
════════════════════════════ */
const tl = gsap.timeline({ delay: 0.5 });

// 1. wordmark fades in
tl.to('.wordmark', {
  opacity: 1, duration: 1.2, ease: 'power2.out'
});

// 2. envelope descends from above
tl.to('#env-scene', {
  opacity: 1, y: 0, duration: 1.4, ease: 'power3.out'
}, '-=0.4');

// gentle float after arrival
gsap.to('#env-scene', {
  y: '-=8', repeat: -1, yoyo: true,
  duration: 4, ease: 'sine.inOut', delay: 2.2
});

// 3. flap opens
tl.call(() => {
  document.getElementById('env-flap').classList.add('open');
}, [], '+=0.4');

// 4. wax seal fades out
tl.call(() => {
  document.getElementById('wax-seal').classList.add('gone');
}, [], '+=0.6');

// 5. letter rises
tl.call(() => {
  document.getElementById('letter-rise').classList.add('open');
}, [], '+=0.2');

// 6. show scroll hint
tl.call(() => {
  document.getElementById('scroll-hint').classList.add('show');
}, [], '+=0.8');

// 7. After a beat, fade entry phase and reveal letter card
tl.call(() => {
  // Wait for first scroll OR auto-advance after 3.5s
  let triggered = false;
  const advance = () => {
    if(triggered) return;
    triggered = true;
    advanceToLetter();
  };
  window.addEventListener('scroll', advance, { once: true });
  setTimeout(advance, 3800);
}, [], '+=1.2');


function advanceToLetter(){
  // Fade out entry phase
  gsap.to('#entry-phase', {
    opacity: 0, duration: 0.9, ease: 'power2.in',
    onComplete: () => {
      document.getElementById('entry-phase').classList.add('hidden');
    }
  });

  // Slide letter card in
  gsap.to('#letter-card', {
    opacity: 1, y: 0, duration: 1.4, ease: 'power3.out', delay: 0.2,
    onComplete: () => {
      // received notice
      document.getElementById('received-notice').classList.add('show');
      // greeting
      setTimeout(() => {
        document.getElementById('letter-greeting').classList.add('show');
      }, 300);
      // typewriter
      setTimeout(() => {
        runTypewriter(
          document.getElementById('typewriter-out'),
          MESSAGE,
          () => {
            // After typewriter done, reveal the rest in sequence
            setTimeout(() => {
              document.getElementById('letter-divider').classList.add('show');
            }, 400);
            setTimeout(() => {
              document.getElementById('letter-from').classList.add('show');
            }, 1000);
            setTimeout(() => {
              document.getElementById('read-receipt').classList.add('show');
              document.getElementById('report-btn').classList.add('show');
            }, 2400);
            setTimeout(() => {
              document.getElementById('watermark').classList.add('show');
            }, 3500);
          }
        );
      }, 700);
    }
  });
}


/* ════════════════════════════
   SCROLL TRIGGERS (GSAP)
   Extra parallax for elements inside the card
════════════════════════════ */
ScrollTrigger.create({
  trigger: '#letter-stage',
  start: 'top 80%',
  onEnter: () => {
    // subtle shimmer on card border
    gsap.to('#letter-card', {
      boxShadow: '0 80px 160px rgba(0,0,0,0.7), 0 0 0 1px rgba(139,144,208,0.08), 0 0 120px rgba(60,60,180,0.18), inset 0 1px 0 rgba(139,144,208,0.08)',
      duration: 2,
      ease: 'power2.out'
    });
  }
});

// Receipt and watermark fade in on scroll
ScrollTrigger.create({
  trigger: '#read-receipt',
  start: 'top 90%',
  onEnter: () => {
    document.getElementById('read-receipt').classList.add('show');
  }
});

ScrollTrigger.create({
  trigger: '#watermark',
  start: 'top 90%',
  onEnter: () => {
    document.getElementById('watermark').classList.add('show');
  }
});
</script>
